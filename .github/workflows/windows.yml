name: Windows

# Builds, tests and packages the Windows desktop app. Pushing a `v*` tag
# publishes the installer, portable zip and checksums to the GitHub Release
# for that tag (creating the release if it does not exist yet).
on:
  push:
    # windows/** branches run the full Windows pipeline without publishing.
    branches: [main, 'windows/**']
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - '**/*.md'
      - 'ios/**'
      - 'macos/**'
      - 'android/**'
      - 'linux/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - '**/*.md'
      - 'ios/**'
      - 'macos/**'
      - 'android/**'
      - 'linux/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for artifact names (defaults to pubspec.yaml)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  unit-tests:
    name: Unit tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter test

  terminal-integration:
    name: Local terminal integration (ConPTY)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter test integration_test/windows_local_terminal_test.dart -d windows

  package:
    name: Build and package
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $pubspec = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
            $core = ($version -split '[-+]', 2)[0]
            if ($core -ne $pubspec) {
              throw "Tag $env:GITHUB_REF_NAME does not match pubspec.yaml version $pubspec."
            }
          } elseif ($env:INPUT_VERSION) {
            $version = $env:INPUT_VERSION
          } else {
            $version = "$pubspec-dev.$env:GITHUB_RUN_NUMBER"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Packaging Serlink $version"

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - run: flutter pub get

      - name: Build and package
        shell: pwsh
        env:
          SERLINK_VERSION: ${{ steps.version.outputs.version }}
        run: ./tool/package_windows.ps1 -Version $env:SERLINK_VERSION

      - name: Launch smoke test
        shell: pwsh
        run: ./tool/smoke_test_windows.ps1 -Exe build/windows/x64/runner/Release/serlink.exe -ArtifactsDir build/smoke

      - name: Upload smoke test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: build/smoke
          if-no-files-found: ignore

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: serlink-windows-x64
          path: build/dist/windows/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, terminal-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: serlink-windows-x64
          path: dist
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            prerelease=()
            if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$TAG" dist/* \
              --title "Serlink ${TAG#v}" \
              --generate-notes \
              --verify-tag \
              "${prerelease[@]}"
          fi
